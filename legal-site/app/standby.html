<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>KYNIO</title>
  <style>
    :root {
      --bg: #EDE6D3;
      --text: #3A3A38;
      --accent: #D9922E;
      --border: #D8D1BE;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1C1915;
        --text: #F1E9D6;
        --accent: #E8A83E;
        --border: #2E2922;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
      padding: 32px 24px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background-color: var(--bg);
    }
    .icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: var(--accent);
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }
    p {
      font-size: 13px;
      opacity: 0.75;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    button {
      background-color: var(--accent);
      color: #1C1915;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 22h14M5 2h14M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2" />
    </svg>
    <h1>KYNIO EM ESPERA</h1>
    <p>A sessão ativa foi transferida para a aplicação principal. Clica abaixo ou volta ao separador para continuar.</p>
    <button onclick="resume()">Continuar no KYNIO</button>
  </div>

  <script>
    function resume() {
      window.location.replace('/KYNIO/app/');
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        resume();
      }
    });
    window.addEventListener('focus', resume);
    window.addEventListener('pageshow', resume);
  </script>
</body>
</html>
